[project]
name = "scoped-evidence-agent"
version = "0.0.1"
description = "An auditable, local-first assistant that collects bounded reconnaissance evidence from explicitly scoped targets and drafts findings that a human must review."
readme = "README.md"
authors = [{ name = "Mohammed Orunsolu" }]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["security", "pentest", "evidence", "reconnaissance", "scope", "audit"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
requires-python = ">=3.13,<3.14"
# Lower bounds = versions resolved on 2026-11-20; upper bounds stop silent major upgrades.
# Exact, hash-pinned versions live in uv.lock (the source of truth).
dependencies = [
    "alembic>=1.20.1,<2",
    "pydantic>=2.14.4,<3",
    "pyyaml>=6.0.4,<7",
    "sqlalchemy>=2.1.9,<3",
    "typer>=0.29.2,<1",
]

[project.scripts]
scoped-agent = "scopedagent.cli:app"

[project.urls]
Homepage = "https://github.com/MDPorsch/scoped-evidence-agent"
Source = "https://github.com/MDPorsch/scoped-evidence-agent"
Issues = "https://github.com/MDPorsch/scoped-evidence-agent/issues"
Security = "https://github.com/MDPorsch/scoped-evidence-agent/security/policy"

[dependency-groups]
dev = [
    "hypothesis>=6.170.17,<7",
    "mypy>=2.4.1,<3",
    "pip-audit>=2.10.1,<3",
    "pytest>=9.2.0,<10",
    "pytest-cov>=7.1.0,<8",
    "ruff>=0.17.6,<1",
    "types-pyyaml>=6.0.12.20261113",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "scopedagent"

# ---------------------------------------------------------------- pytest ----
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "milestone(name): the milestone (M1..M6) that must make this test pass; a red test is never skipped or xfailed",
]

# ------------------------------------------------------------------ ruff ----
[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF", "PT", "ASYNC", "T20", "PL"]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
# PT018: a composite assertion states one property; E501: long literals in test data; S103: the permission tests
# create loose modes on purpose; PT012: `raises` wraps a failing call together with its transaction block;
# RUF043/SIM117/C408/RUF007/PLW0108: style only.
"tests/**" = ["S101", "S103", "S608", "S105", "S106", "S311", "S104", "S108", "S603", "S607", "PLR0913", "PLR0915", "PLR0917", "PT012", "PT018", "E501", "RUF043", "RUF007", "SIM117", "C408", "PLW0108"]
"tools/**" = ["E501", "PLR0913", "T201", "S603", "S607"]
"src/scopedagent/cli.py" = ["T201", "PLR0913", "PLR0917"]  # a CLI command has one parameter per option
"src/scopedagent/storage/**" = ["PLR0913", "PLR0917"]  # service functions take explicit keyword-only arguments on purpose
"src/scopedagent/policy/**" = ["PLR0913", "PLR0917"]
"src/scopedagent/pipeline/**" = ["PLR0913", "PLR0917"]
"src/scopedagent/adapters/**" = ["PLR0911", "PLR0913", "PLR0917"]  # many answers to one question; keyword-only arguments
"src/scopedagent/storage/migrations/versions/*" = ["E501"]  # SQL lists

# ------------------------------------------------------------------ mypy ----
[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

# -------------------------------------------------------------- coverage ----
[tool.coverage.run]
branch = true
source = ["scopedagent"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90
